[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmorphis"
version = "0.1.0"
description = "Self-Supervised and Federated Learning for Biomedical Applications (Diabetic Retinopathy Lesion Segmentation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FedMorphis Research Team" }
]
keywords = [
    "biomedical-segmentation",
    "diabetic-retinopathy",
    "self-supervised-learning",
    "simclr",
    "federated-learning",
    "flower",
    "monai",
    "pytorch"
]
dependencies = [
    "PyYAML>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<4.0.0",
]

[project.optional-dependencies]
dl = [
    "torch>=2.5.0,<3.0.0",
    "torchvision>=0.20.0,<1.0.0",
    "torchmetrics>=1.3.0,<2.0.0",
    "monai>=1.3.0,<2.0.0",
    "albumentations>=1.4.0,<3.0.0",
    "opencv-python-headless>=4.9.0,<5.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
]
federated = [
    "flwr>=1.11.0,<2.0.0",
]
app = [
    "matplotlib>=3.8.0,<4.0.0",
    "plotly>=5.20.0,<7.0.0",
    "streamlit>=1.35.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "mlflow>=2.14.0,<4.0.0",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

