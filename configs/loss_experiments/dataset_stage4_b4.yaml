# Stage 4 Shared Dataset Configuration (4 GB RTX 3050 Laptop GPU: 512x512, batch_size=4)
dataset_names:
  - "DDR"
  - "IDRiD"

paths:
  raw_ddr: "data/raw/DDR"
  raw_idrid: "data/raw/IDRiD"
  processed: "data/processed"
  manifests: "data/processed/manifests"
  partitions: "data/partitions"

lesion_classes:
  - "background"
  - "microaneurysms"        # MA
  - "hemorrhages"           # HE
  - "hard_exudates"         # EX
  - "soft_exudates"         # SE

canonical_lesion_channels:
  - "MA"
  - "HE"
  - "EX"
  - "SE"
excluded_anatomical_structures:
  - "OD"
mask_binarization_threshold: 0

fov_cropping:
  enabled: true
  intensity_threshold: 10
  margin_pixels: 0
  min_fov_area_fraction: 0.01
  preserve_boundary_lesions: true
  fallback_to_full_image: true

image_size:
  height: 512
  width: 512
batch_size: 4
number_of_workers: 0
pin_memory: true
persistent_workers: false
drop_last_train: false

evaluation_transforms:
  resize_interpolation: "linear"
  mask_interpolation: "nearest"
  normalize: true

normalization:
  enabled: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  fov_crop: true
  clahe_enhancement: false

augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.5
  random_rotate90_prob: 0.5
  color_jitter:
    enabled: true
    prob: 0.5
    brightness: 0.15
    contrast: 0.15
    saturation: 0.15
    hue: 0.05

train_validation_test_split:
  train: 0.70
  validation: 0.15
  test: 0.15

patch_training:
  enabled: false
  patch_size: 512
  stride: 256
  sampling_strategy: "lesion_aware"
  background_ratio: 0.25
  sampling_weights:
    MA: 5.0
    SE: 3.0
    HE: 2.0
    EX: 1.0
    background: 0.5
  epoch_samples: 500
  seed: 42
  cache_fov_images: true

sliding_window_inference:
  patch_size: 512
  overlap: 0.50
  blending: "gaussian"
  gaussian_sigma_scale: 0.125
  batch_size: 4
