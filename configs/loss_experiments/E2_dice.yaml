# Stage 4 Experiment E2: Unweighted BCE + Soft Dice
# Isolates Tversky-to-Dice overlap objective change relative to E0.
architecture: "UNet"
encoder: "resnet50"
pretrained: true
strict_pretrained: false
input_channels: 3
number_of_classes: 4
output_channels: 4
output_channel_order:
  - "MA"
  - "HE"
  - "EX"
  - "SE"

decoder:
  channels: [256, 128, 64, 32, 16]
  use_batchnorm: true
  dropout: 0.1
  activation: null

encoder_weights_source: "imagenet"
ssl_checkpoint_path: "checkpoints/ssl/ddr_simclr/best_simclr_encoder.pt"

loss:
  type: "bce_dice"
  bce_weight: 0.5
  dice_weight: 0.5
  smooth: 1.0e-5
  pos_weight: null
  class_weights: null

training:
  optimizer: "adamw"
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 50
  mixed_precision: true
  gradient_clip_max_norm: 1.0
  metric_threshold: 0.5
  checkpoint_directory: "checkpoints/loss_experiments/E2_dice"
  monitor_metric: "val_dice_macro"
  monitor_mode: "max"
