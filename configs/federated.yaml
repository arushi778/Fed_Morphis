# Federated Learning Configuration (Flower) (Phase 1 Partitioning + Phase 4/5 Training)
strategy: "FedAvg"  # Supported options: "FedAvg", "FedProx"
aggregation_method: "weighted_average"

# Topology & client scheduling
number_of_clients: 4
client_fraction: 1.0
min_fit_clients: 2
min_evaluate_clients: 2
min_available_clients: 2

# Training schedule
communication_rounds: 20
local_epochs: 3
local_batch_size: 8
local_learning_rate: 0.0001

# FedProx proximal term hyperparameter (used when strategy == "FedProx")
fedprox_mu: 0.01

# Reproducible client data partitioning across official training splits only
# Supported schemes: "iid", "dirichlet" ("non_iid"), "cross_dataset" ("by_dataset")
partitioning:
  scheme: "dirichlet"
  seed: 42
  dirichlet_alpha: 0.5
  min_samples_per_client: 1
  output_directory: "data/partitions"

# Federated training mode ("segmentation" or "ssl")
federated_mode: "segmentation"
